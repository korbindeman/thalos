[workspace]
resolver = "3"
members = [
    "crates/physics_canonical",
    "crates/terrain",
    "crates/atmosphere",
    "crates/celestial",
    "crates/input",
    "crates/planet_lighting",
    "crates/planet_rendering",
    "crates/planet_editor",
    "crates/game",
    "crates/shipyard",
    "crates/bake_dump",
    "crates/terrain_render",
    "crates/udlod",
    "crates/physics_local",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Optimize dependencies in dev builds for runtime performance without
# sacrificing incremental compile speed on our own crates.
[workspace.dependencies]
thalos_udlod = { path = "crates/udlod" }

[profile.dev]
opt-level = 1
# Disabled to avoid macOS incremental-compilation linker bug (stale
# .llvm.<hash> anonymous symbol references between rcgu objects).
incremental = false

[profile.dev.package."*"]
opt-level = 3

# Release: single codegen unit for cross-crate inlining + thin LTO.
[profile.release]
codegen-units = 1
lto = "thin"
