[workspace]
resolver = "3"
members = [
    "crates/world",
    "crates/physics_canonical",
    "crates/control",
    "crates/terrain",
    "crates/celestial",
    "crates/texgen",
    "crates/input",
    "crates/ui",
    "crates/body_render",
    "crates/game",
    "crates/shipyard",
    "crates/udlod",
    "crates/physics_local",
    "crates/big_space",
    "crates/bevy_erosion_filter",
    "crates/terrain_baker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thalos_udlod = { path = "crates/udlod" }
# Vendored fork (crates/big_space). i64 cell precision is the workspace-wide
# choice; consumers inherit it via `big_space = { workspace = true }`.
big_space = { path = "crates/big_space", features = ["i64"] }

# Shared dev defaults stay portable. Platform-specific compiler/linker
# tuning belongs in local, ignored Cargo config; see `docs/tooling.md`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release: single codegen unit for cross-crate inlining + thin LTO.
[profile.release]
codegen-units = 1
lto = "thin"
