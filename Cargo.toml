[workspace]
resolver = "3"
members = [
    "crates/world",
    "crates/physics_canonical",
    "crates/terrain",
    "crates/celestial",
    "crates/input",
    "crates/body_render",
    "crates/body_editor",
    "crates/game",
    "crates/shipyard",
    "crates/bake_dump",
    "crates/udlod",
    "crates/physics_local",
    "crates/avian_fdm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thalos_udlod = { path = "crates/udlod" }
# Vendored LGPL flight-dynamics model (force-only use in the local bubble).
# default-features off so the f64 backend is selected explicitly and the
# f32-pulling `debug-plugin` stays off. See crates/avian_fdm + docs/aerodynamics.md.
avian_fdm = { path = "crates/avian_fdm", default-features = false, features = ["f64"] }

# Shared dev defaults stay portable. Platform-specific compiler/linker
# tuning belongs in local, ignored Cargo config; see `docs/tooling.md`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release: single codegen unit for cross-crate inlining + thin LTO.
[profile.release]
codegen-units = 1
lto = "thin"
