[licenses]
version = 2

# Workspace crates carry their own PolyForm-Noncommercial license; skip them.
private.ignore = true

# Allow common permissive licenses found in the Rust / Bevy ecosystem.
# cargo-deny evaluates SPDX OR expressions: a crate licensed
# "Apache-2.0 OR GPL-2.0-only" satisfies this list via Apache-2.0 and passes.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OFL-1.1",
  "BSL-1.0",
]

# GPL and AGPL are viral across the combined work and void the
# PolyForm-Noncommercial model.  Listed explicitly so the error message
# names the offending license rather than just "not in allow list".
deny = [
  "GPL-2.0",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "GPL-3.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "AGPL-3.0",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]
