[licenses]
version = 2

# Workspace crates carry their own PolyForm-Noncommercial license; skip them.
private.ignore = true

# Allow common permissive licenses found in the Rust / Bevy ecosystem.
# cargo-deny evaluates SPDX OR expressions: a crate licensed
# "Apache-2.0 OR GPL-2.0-only" satisfies this list via Apache-2.0 and passes.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "BSL-1.0",
]

# With version = 2, any license not in the allow list is denied — no
# explicit deny list needed.  GPL/AGPL are rejected by omission.
