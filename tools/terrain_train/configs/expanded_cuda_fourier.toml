[run]
name = "mira_l2_kaguya_cuda_fourier_v5b"
seed = 1004
output_dir = "../../terrain_runs/mira_l2_kaguya_cuda_fourier_v5b"
data_dir = "../../terrain_data/synthetic/mira_l2_kaguya_cuda_fourier_v5b"

[data]
sample_count = 0
patch_size = 64
metres_per_pixel = 160.0
validation_fraction = 0.0
crater_density = [8.0, 36.0]
mare_fraction = [0.1, 0.35]
gardening = [0.1, 0.85]
rim_sharpness = [0.5, 1.6]

[[data.real_sources]]
index = "../../terrain_data/processed/kaguya_s3/train/index.json"
crater_density = 20.0
mare_fraction = 0.25
gardening = 0.35
rim_sharpness = 1.0

[[data.real_sources]]
index = "../../terrain_data/processed/kaguya_expanded_s3/train/index.json"
crater_density = 20.0
mare_fraction = 0.2
gardening = 0.4
rim_sharpness = 1.0

[[data.real_sources]]
index = "../../terrain_data/processed/kaguya_s3/validation/index.json"
crater_density = 20.0
mare_fraction = 0.1
gardening = 0.25
rim_sharpness = 1.2

[model]
base_channels = 32
condition_dim = 4
time_conditioning = "fourier"

[diffusion]
timesteps = 100
sample_steps = 25
beta_start = 0.0001
beta_end = 0.2
prediction = "velocity"

[train]
epochs = 120
batch_size = 8
learning_rate = 0.0002
ema_decay = 0.999
gradient_clip = 1.0
num_workers = 0
device = "auto"
resume = false
checkpoint_every_epochs = 10

[validation]
canvas_width = 64
canvas_height = 64
stride = 32
reference_source_id = "kaguya_copernicus_validation"
