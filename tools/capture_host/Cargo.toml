[package]
name = "thalos_capture_host"
publish = false
version.workspace = true
edition.workspace = true

[dependencies]
thalos_capture_runtime = { path = "../../crates/capture/runtime" }

[features]
neural-terrain = ["thalos_capture_runtime/neural-terrain"]
neural-terrain-default = ["neural-terrain", "thalos_capture_runtime/neural-terrain-default"]
dev-renderer = ["neural-terrain", "thalos_capture_runtime/dev-renderer"]
gpu-counters = ["thalos_capture_runtime/gpu-counters"]
