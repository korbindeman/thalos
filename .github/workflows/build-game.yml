name: Build game
run-name: ${{ inputs.release_ref != '' && format('Release {0}', inputs.release_ref) || format('Build {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      cargo_features:
        description: Comma-separated thalos_game features
        required: false
        default: neural-terrain-default
        type: string
      use_default_features:
        description: Also enable thalos_game default features
        required: true
        default: false
        type: boolean
      release_ref:
        description: "Internal: immutable tag ref supplied by the release dispatcher"
        required: false
        default: ""
        type: string
      release_sha:
        description: "Internal: expected commit for release_ref"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.0

jobs:
  prepare:
    name: Resolve build configuration
    runs-on: ubuntu-latest
    outputs:
      cargo_features: ${{ steps.configuration.outputs.cargo_features }}
      use_default_features: ${{ steps.configuration.outputs.use_default_features }}
      is_release: ${{ steps.configuration.outputs.is_release }}
      release_tag: ${{ steps.configuration.outputs.release_tag }}
      source_revision: ${{ steps.configuration.outputs.source_revision }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Resolve and validate feature selection
        id: configuration
        shell: bash
        env:
          INPUT_CARGO_FEATURES: ${{ inputs.cargo_features }}
          INPUT_USE_DEFAULT_FEATURES: ${{ inputs.use_default_features }}
          INPUT_RELEASE_REF: ${{ inputs.release_ref }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          features="${INPUT_CARGO_FEATURES}"
          use_defaults="${INPUT_USE_DEFAULT_FEATURES}"

          if [[ -n "${features}" && ! "${features}" =~ ^[A-Za-z0-9_.-]+(,[A-Za-z0-9_.-]+)*$ ]]; then
            echo "Features must be a comma-separated list of Cargo feature names." >&2
            exit 1
          fi
          if [[ "${use_defaults}" != "true" && "${use_defaults}" != "false" ]]; then
            echo "use_default_features must be true or false." >&2
            exit 1
          fi

          source_revision="$(git rev-parse HEAD)"
          is_release="false"
          release_tag=""

          if [[ -n "${INPUT_RELEASE_REF}" || -n "${INPUT_RELEASE_SHA}" ]]; then
            if [[ -z "${INPUT_RELEASE_REF}" || -z "${INPUT_RELEASE_SHA}" ]]; then
              echo "release_ref and release_sha must be supplied together." >&2
              exit 1
            fi
            if [[ ! "${INPUT_RELEASE_REF}" =~ ^refs/tags/v[0-9A-Za-z.+-]+$ ]]; then
              echo "release_ref must be a refs/tags/v* ref." >&2
              exit 1
            fi
            if [[ ! "${INPUT_RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "release_sha must be a full lowercase commit SHA." >&2
              exit 1
            fi
            if [[ "${source_revision}" != "${INPUT_RELEASE_SHA}" ]]; then
              echo "Release ref resolved to ${source_revision}, expected ${INPUT_RELEASE_SHA}." >&2
              exit 1
            fi

            is_release="true"
            release_tag="${INPUT_RELEASE_REF#refs/tags/}"
          fi

          echo "cargo_features=${features}" >> "${GITHUB_OUTPUT}"
          echo "use_default_features=${use_defaults}" >> "${GITHUB_OUTPUT}"
          echo "is_release=${is_release}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "source_revision=${source_revision}" >> "${GITHUB_OUTPUT}"
          echo "Cargo features: ${features:-<none>}"
          echo "Use default features: ${use_defaults}"
          echo "Source revision: ${source_revision}"
          echo "Release tag: ${release_tag:-<manual build>}"

      - name: Validate release tag matches workspace version
        if: steps.configuration.outputs.is_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.configuration.outputs.release_tag }}
        run: |
          version="$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              value = $0
              sub(/^[^"]*"/, "", value)
              sub(/".*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)"
          tag="${RELEASE_TAG#v}"

          if [[ -z "${version}" ]]; then
            echo "Could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "${tag}" != "${version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match workspace version ${version}" >&2
            exit 1
          fi

  build-windows:
    name: Windows x64 build
    needs: prepare
    runs-on: windows-2022
    env:
      BUILD_FEATURES: ${{ needs.prepare.outputs.cargo_features }}
      USE_DEFAULT_FEATURES: ${{ needs.prepare.outputs.use_default_features }}
      BUILD_TARGET: x86_64-pc-windows-msvc
      BINARY_ARTIFACT: windows-build-executable
      # Keep the portable ZIP independent of a separately installed Visual C++
      # redistributable. GPU/system DLLs remain ordinary Windows dependencies.
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_revision }}

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.0 --profile minimal --target $env:BUILD_TARGET

      - name: Restore Rust dependency cache
        id: rust-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: v1-release
          key: ${{ env.BUILD_TARGET }}-${{ env.BUILD_FEATURES }}-defaults-${{ env.USE_DEFAULT_FEATURES }}
          cache-bin: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Record Rust cache result
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          "### Windows Rust dependency cache" >> $env:GITHUB_STEP_SUMMARY
          "Exact hit: ``$env:CACHE_HIT``" >> $env:GITHUB_STEP_SUMMARY
          "Target: ``$env:BUILD_TARGET``" >> $env:GITHUB_STEP_SUMMARY

      - name: Build game
        shell: pwsh
        run: |
          $arguments = @(
            "build", "--release", "--locked", "-p", "thalos_game",
            "--target", $env:BUILD_TARGET
          )
          if ($env:USE_DEFAULT_FEATURES -ne "true") {
            $arguments += "--no-default-features"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:BUILD_FEATURES)) {
            $arguments += @("--features", $env:BUILD_FEATURES)
          }
          & cargo @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keep the expensive compile as a separate successful job. If packaging
      # rejects an archive, rerunning failed jobs reuses this executable rather
      # than paying for the release graph again.
      - name: Upload compiled executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_ARTIFACT }}
          path: target/${{ env.BUILD_TARGET }}/release/thalos_game.exe
          if-no-files-found: error
          retention-days: 2

  package-windows:
    name: Windows x64 package
    needs: [prepare, build-windows]
    runs-on: windows-2022
    env:
      BUILD_FEATURES: ${{ needs.prepare.outputs.cargo_features }}
      USE_DEFAULT_FEATURES: ${{ needs.prepare.outputs.use_default_features }}
      BUILD_TARGET: x86_64-pc-windows-msvc
      BUILD_ARTIFACT: thalos_game-windows-x64
      BINARY_ARTIFACT: windows-build-executable
      SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}

    steps:
      - name: Checkout runtime content
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_revision }}
          lfs: true

      - name: Verify Git LFS objects
        shell: bash
        run: git lfs fsck --objects

      - name: Download compiled executable
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_ARTIFACT }}
          path: target/${{ env.BUILD_TARGET }}/release

      - name: Package and verify portable install
        shell: pwsh
        run: |
          ./scripts/package-game.ps1 `
            -Executable "target/$env:BUILD_TARGET/release/thalos_game.exe" `
            -Artifact $env:BUILD_ARTIFACT `
            -RequestedFeatures $env:BUILD_FEATURES `
            -UseDefaultFeatures ($env:USE_DEFAULT_FEATURES -eq "true") `
            -Target $env:BUILD_TARGET `
            -Revision $env:SOURCE_REVISION

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: |
            dist/${{ env.BUILD_ARTIFACT }}.zip
            dist/${{ env.BUILD_ARTIFACT }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS arm64
    if: needs.prepare.outputs.is_release == 'true'
    needs: prepare
    runs-on: macos-14
    env:
      BUILD_FEATURES: ${{ needs.prepare.outputs.cargo_features }}
      USE_DEFAULT_FEATURES: ${{ needs.prepare.outputs.use_default_features }}
      BUILD_TARGET: aarch64-apple-darwin
      BUILD_ARTIFACT: thalos_game-macos-arm64
      SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}

    steps:
      - name: Checkout runtime content
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_revision }}
          lfs: true

      - name: Verify Git LFS objects
        run: git lfs fsck --objects

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --target "${BUILD_TARGET}"

      - name: Restore Rust dependency cache
        id: rust-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: v1-release
          key: ${{ env.BUILD_TARGET }}-${{ env.BUILD_FEATURES }}-defaults-${{ env.USE_DEFAULT_FEATURES }}
          cache-bin: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Record Rust cache result
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          {
            echo "### macOS Rust dependency cache"
            echo "Exact hit: \`${CACHE_HIT}\`"
            echo "Target: \`${BUILD_TARGET}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build game
        shell: bash
        run: |
          arguments=(build --release --locked -p thalos_game --target "${BUILD_TARGET}")
          if [[ "${USE_DEFAULT_FEATURES}" != "true" ]]; then
            arguments+=(--no-default-features)
          fi
          if [[ -n "${BUILD_FEATURES}" ]]; then
            arguments+=(--features "${BUILD_FEATURES}")
          fi
          cargo "${arguments[@]}"

      - name: Package macOS artifact
        shell: bash
        run: |
          package="dist/${BUILD_ARTIFACT}"
          mkdir -p "${package}"
          cp "target/${BUILD_TARGET}/release/thalos_game" "${package}/"
          cp -R assets ships "${package}/"
          cp LICENSE LICENSE-ASSETS LICENSING.md "${package}/"
          "${package}/thalos_game" --build-info > "${package}/BUILD_INFO.txt"
          printf 'revision=%s\ntarget=%s\nrequested_features=%s\nuse_default_features=%s\n' \
            "${SOURCE_REVISION}" "${BUILD_TARGET}" "${BUILD_FEATURES:-<none>}" \
            "${USE_DEFAULT_FEATURES}" >> "${package}/BUILD_INFO.txt"
          tar -czf "dist/${BUILD_ARTIFACT}.tar.gz" -C dist "${BUILD_ARTIFACT}"
          (cd dist && shasum -a 256 "${BUILD_ARTIFACT}.tar.gz" > "${BUILD_ARTIFACT}.tar.gz.sha256")

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: |
            dist/${{ env.BUILD_ARTIFACT }}.tar.gz
            dist/${{ env.BUILD_ARTIFACT }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub prerelease
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, package-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: thalos_game-*
          path: dist
          merge-multiple: true

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "${RELEASE_TAG} pre-alpha" \
            --generate-notes
