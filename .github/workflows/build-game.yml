name: Build game

on:
  workflow_dispatch:
    inputs:
      cargo_features:
        description: Comma-separated thalos_game features
        required: false
        default: neural-terrain-default
        type: string
      use_default_features:
        description: Also enable thalos_game default features
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.0

jobs:
  prepare:
    name: Resolve build configuration
    runs-on: ubuntu-latest
    outputs:
      cargo_features: ${{ steps.configuration.outputs.cargo_features }}
      use_default_features: ${{ steps.configuration.outputs.use_default_features }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate feature selection
        id: configuration
        shell: bash
        env:
          INPUT_CARGO_FEATURES: ${{ inputs.cargo_features }}
          INPUT_USE_DEFAULT_FEATURES: ${{ inputs.use_default_features }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            features="${INPUT_CARGO_FEATURES}"
            use_defaults="${INPUT_USE_DEFAULT_FEATURES}"
          else
            features="neural-terrain-default"
            use_defaults="false"
          fi

          if [[ -n "${features}" && ! "${features}" =~ ^[A-Za-z0-9_.-]+(,[A-Za-z0-9_.-]+)*$ ]]; then
            echo "Features must be a comma-separated list of Cargo feature names." >&2
            exit 1
          fi
          if [[ "${use_defaults}" != "true" && "${use_defaults}" != "false" ]]; then
            echo "use_default_features must be true or false." >&2
            exit 1
          fi

          echo "cargo_features=${features}" >> "${GITHUB_OUTPUT}"
          echo "use_default_features=${use_defaults}" >> "${GITHUB_OUTPUT}"
          echo "Cargo features: ${features:-<none>}"
          echo "Use default features: ${use_defaults}"

      - name: Validate release tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              value = $0
              sub(/^[^"]*"/, "", value)
              sub(/".*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)"
          tag="${GITHUB_REF_NAME#v}"

          if [[ -z "${version}" ]]; then
            echo "Could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "${tag}" != "${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi

  build-windows:
    name: Windows x64 build
    needs: prepare
    runs-on: windows-2022
    env:
      BUILD_FEATURES: ${{ needs.prepare.outputs.cargo_features }}
      USE_DEFAULT_FEATURES: ${{ needs.prepare.outputs.use_default_features }}
      BUILD_TARGET: x86_64-pc-windows-msvc
      BINARY_ARTIFACT: windows-build-executable
      # Keep the portable ZIP independent of a separately installed Visual C++
      # redistributable. GPU/system DLLs remain ordinary Windows dependencies.
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.0 --profile minimal --target $env:BUILD_TARGET

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: windows-${{ runner.arch }}-${{ env.BUILD_TARGET }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-${{ runner.arch }}-${{ env.BUILD_TARGET }}-cargo-

      - name: Build game
        shell: pwsh
        run: |
          $arguments = @(
            "build", "--release", "--locked", "-p", "thalos_game",
            "--target", $env:BUILD_TARGET
          )
          if ($env:USE_DEFAULT_FEATURES -ne "true") {
            $arguments += "--no-default-features"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:BUILD_FEATURES)) {
            $arguments += @("--features", $env:BUILD_FEATURES)
          }
          & cargo @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keep the expensive compile as a separate successful job. If packaging
      # rejects an archive, rerunning failed jobs reuses this executable rather
      # than paying for the release graph again.
      - name: Upload compiled executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_ARTIFACT }}
          path: target/${{ env.BUILD_TARGET }}/release/thalos_game.exe
          if-no-files-found: error
          retention-days: 2

  package-windows:
    name: Windows x64 package
    needs: [prepare, build-windows]
    runs-on: windows-2022
    env:
      BUILD_FEATURES: ${{ needs.prepare.outputs.cargo_features }}
      USE_DEFAULT_FEATURES: ${{ needs.prepare.outputs.use_default_features }}
      BUILD_TARGET: x86_64-pc-windows-msvc
      BUILD_ARTIFACT: thalos_game-windows-x64
      BINARY_ARTIFACT: windows-build-executable

    steps:
      - name: Checkout runtime content
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS objects
        shell: bash
        run: git lfs fsck --objects

      - name: Download compiled executable
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_ARTIFACT }}
          path: target/${{ env.BUILD_TARGET }}/release

      - name: Package and verify portable install
        shell: pwsh
        run: |
          ./scripts/package-game.ps1 `
            -Executable "target/$env:BUILD_TARGET/release/thalos_game.exe" `
            -Artifact $env:BUILD_ARTIFACT `
            -RequestedFeatures $env:BUILD_FEATURES `
            -UseDefaultFeatures ($env:USE_DEFAULT_FEATURES -eq "true") `
            -Target $env:BUILD_TARGET `
            -Revision $env:GITHUB_SHA

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: |
            dist/${{ env.BUILD_ARTIFACT }}.zip
            dist/${{ env.BUILD_ARTIFACT }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS arm64
    if: github.event_name == 'push'
    needs: prepare
    runs-on: macos-14
    env:
      BUILD_FEATURES: ${{ needs.prepare.outputs.cargo_features }}
      USE_DEFAULT_FEATURES: ${{ needs.prepare.outputs.use_default_features }}
      BUILD_TARGET: aarch64-apple-darwin
      BUILD_ARTIFACT: thalos_game-macos-arm64

    steps:
      - name: Checkout runtime content
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS objects
        run: git lfs fsck --objects

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --target "${BUILD_TARGET}"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-${{ runner.arch }}-${{ env.BUILD_TARGET }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-${{ runner.arch }}-${{ env.BUILD_TARGET }}-cargo-

      - name: Build game
        shell: bash
        run: |
          arguments=(build --release --locked -p thalos_game --target "${BUILD_TARGET}")
          if [[ "${USE_DEFAULT_FEATURES}" != "true" ]]; then
            arguments+=(--no-default-features)
          fi
          if [[ -n "${BUILD_FEATURES}" ]]; then
            arguments+=(--features "${BUILD_FEATURES}")
          fi
          cargo "${arguments[@]}"

      - name: Package macOS artifact
        shell: bash
        run: |
          package="dist/${BUILD_ARTIFACT}"
          mkdir -p "${package}"
          cp "target/${BUILD_TARGET}/release/thalos_game" "${package}/"
          cp -R assets ships "${package}/"
          cp LICENSE LICENSE-ASSETS LICENSING.md "${package}/"
          "${package}/thalos_game" --build-info > "${package}/BUILD_INFO.txt"
          printf 'revision=%s\ntarget=%s\nrequested_features=%s\nuse_default_features=%s\n' \
            "${GITHUB_SHA}" "${BUILD_TARGET}" "${BUILD_FEATURES:-<none>}" \
            "${USE_DEFAULT_FEATURES}" >> "${package}/BUILD_INFO.txt"
          tar -czf "dist/${BUILD_ARTIFACT}.tar.gz" -C dist "${BUILD_ARTIFACT}"
          (cd dist && shasum -a 256 "${BUILD_ARTIFACT}.tar.gz" > "${BUILD_ARTIFACT}.tar.gz.sha256")

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: |
            dist/${{ env.BUILD_ARTIFACT }}.tar.gz
            dist/${{ env.BUILD_ARTIFACT }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, package-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: thalos_game-*
          path: dist
          merge-multiple: true

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "${GITHUB_REF_NAME} pre-alpha" \
            --generate-notes
