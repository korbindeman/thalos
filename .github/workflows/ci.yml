name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly

jobs:
  boundaries:
    name: Crate dependency boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Pure-Rust crates must not depend on Bevy
        shell: bash
        run: |
          # Design invariant (CLAUDE.md): render_model, world,
          # physics_canonical, control, terrain, celestial, and texgen are pure
          # Rust libraries with no Bevy dependency. This is
          # a `cargo tree` boundary check, not a build — it stays fast and
          # catches transitive leaks (e.g. a registry dep pulling Bevy via its
          # default features) the moment they enter Cargo.lock.
          #
          # `bevy_erosion_filter` is intentionally allowed: terrain uses its
          # pure-glam `cpu` module with default-features = false, so the crate
          # is present by name but pulls no Bevy engine crate.
          status=0
          for crate in \
            thalos_render_model \
            thalos_world \
            thalos_physics_canonical \
            thalos_control \
            thalos_terrain \
            thalos_celestial \
            thalos_texgen; do
            offenders="$(cargo tree -p "$crate" -e normal \
              | grep -oE '\bbevy[a-z0-9_]* v[0-9][^ ]*' \
              | grep -vE '^bevy_erosion_filter ' \
              | sort -u || true)"
            if [ -n "$offenders" ]; then
              echo "::error::${crate} pulled in Bevy:"
              echo "$offenders"
              status=1
            else
              echo "OK: ${crate} has no Bevy in its dependency tree"
            fi
          done
          exit "$status"

      - name: GPU foundation must not depend on applications or adapters
        shell: bash
        run: |
          # The Bevy foundation may depend on Bevy and the shared diagnostics
          # lane. It must not learn about a world, spatial adapter, gameplay,
          # or application composition (rkit §3/§8).
          offenders="$(cargo tree -p thalos_render_foundation -e normal \
            | grep -E '(^| )((thalos_[a-z_]+)|korsou) v' \
            | grep -vE 'thalos_(render_foundation|diagnostics) ' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::thalos_render_foundation pulled in an application or adapter crate:"
            echo "$offenders"
            exit 1
          fi
          echo "OK: thalos_render_foundation contains only shared GPU infrastructure"

      - name: Render-kit dependency direction and default renderer graph
        shell: bash
        run: |
          # rkit §3/§9: the pure render model cannot learn about Bevy or an
          # application, and ordinary game/capture builds must not compile the
          # sealed UDLOD comparison backend.
          model_offenders="$(cargo tree -p thalos_render_model -e normal \
            | grep -E '(^| )(bevy|thalos_(runtime|game_runtime|game_state|hud|map|physics_local|udlod)) v' || true)"
          if [ -n "$model_offenders" ]; then
            echo "::error::thalos_render_model crossed the pure model boundary:"
            echo "$model_offenders"
            exit 1
          fi

          for package in thalos_game thalos_capture_host korsou; do
            if cargo tree -p "$package" -e normal | grep -qE '(^| )thalos_udlod v'; then
              echo "::error::${package} compiles legacy UDLOD in its default graph"
              exit 1
            fi
            echo "OK: ${package} default graph excludes thalos_udlod"
          done

          legacy_consumers="$(cargo tree --color never -p thalos_body_render --features legacy-udlod \
            -i thalos_udlod -e normal | tail -n +2 \
            | grep -vE '^[├└]── thalos_body_render ' || true)"
          if [ -n "$legacy_consumers" ]; then
            echo "::error::a package other than thalos_body_render directly consumes thalos_udlod:"
            echo "$legacy_consumers"
            exit 1
          fi
          echo "OK: UDLOD is sealed behind thalos_body_render/legacy-udlod"

      - name: Runtime capability bundles stay lightweight and buildable
        shell: bash
        run: bash scripts/check_runtime_capabilities.sh

      - name: Avian is named only by the backend-seam executor layer
        shell: bash
        run: |
          # Backend seam (docs/simulation/physics.md): the Avian dependency — re-exported as
          # `thalos_physics_local::avian` — may only be NAMED by the executor
          # layer. Everything else reads canonical state / the `CraftRegime`
          # record / the Avian-free `LocalCraftKinematics` readout. Keeping this
          # surface small is what makes the eventual swap to the owned
          # `thalos_physics` solver surgical (Phase 0). Allowlist:
          #   crates/simulation/physics_local/**           the boundary crate itself
          #   crates/runtime/game/src/local_physics/**  snap/readback/forces/colliders/clock
          #   crates/runtime/game/src/aero.rs           force layer (runs inside the substep)
          #   crates/runtime/game/src/regime.rs         authority executor + classifier
          #   crates/runtime/game/src/player_controller.rs + debug.rs   the EVA exception
          allow='crates/simulation/physics_local/|crates/runtime/game/src/local_physics/|crates/runtime/game/src/aero\.rs|crates/runtime/game/src/regime\.rs|crates/runtime/game/src/player_controller\.rs|crates/runtime/game/src/debug\.rs'
          offenders="$(grep -rnE 'avian3d|avian::' crates --include='*.rs' | grep -vE "$allow" || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Avian named outside the backend-seam allowlist (docs/simulation/physics.md):"
            echo "$offenders"
            exit 1
          fi
          echo "OK: Avian is named only within the executor allowlist"

  licenses:
    name: No GPL/AGPL dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "^0.16"

      - name: Check licenses
        # cargo-deny evaluates SPDX OR expressions properly:
        # "Apache-2.0 OR GPL-2.0-only" passes because Apache-2.0 is in the
        # allow list (deny.toml).  GPL/AGPL entries in the deny list still
        # catch purely-copyleft crates.  See deny.toml for the full policy.
        run: cargo deny check licenses
