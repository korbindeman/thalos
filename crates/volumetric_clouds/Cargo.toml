[package]
name = "thalos_volumetric_clouds"
description = "Vendored fork of bevy-volumetric-clouds (MIT, evroon) — HZD-style raymarched volumetric clouds, adapted for Thalos's spherical, BigSpace, dual-camera engine. See LICENSE + README for upstream attribution."
version.workspace = true
edition.workspace = true

[dependencies]
# Full default-feature Bevy: this is a Bevy-consumer crate (like body_render /
# game), not one of the CI-guarded pure-Rust libraries. The game already pulls
# full Bevy, so feature unification makes this cost nothing extra in the graph.
bevy = { version = "0.19" }
