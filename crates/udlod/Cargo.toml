[package]
name = "thalos_udlod"
description = "Spherical UDLOD terrain renderer for Thalos. Fork of kurtkuehnert/bevy_terrain (MIT OR Apache-2.0)."
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"
edition = "2021"
exclude = ["assets/*"]
readme = "README.md"
authors = ["Kurt Kühnert <kurt@kuehnert.dev>", "Korbin de Man <korbindeman4@gmail.com>"]

[dependencies]
bevy = "0.18"
ndarray = "0.17"
itertools = "0.14"
bitflags = "2.11"
bytemuck = "1.25"
anyhow = "1.0"
async-channel = "2.5"
big_space = "0.12"
