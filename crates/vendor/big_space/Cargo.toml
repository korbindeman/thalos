# Vendored fork of `big_space` (aevyrie) — a floating-origin plugin for Bevy.
#
# Forked from https://github.com/aevyrie/big_space at v0.12.0
# (MIT OR Apache-2.0). Vendored into the Thalos workspace so the high-precision
# substrate is on our own version cadence: big_space is a single-maintainer
# crate that historically lags each Bevy release, and it is an unconditional
# foundational dependency (real_space, the vendored udlod terrain renderer,
# body_render). Owning it takes it off the critical path on every Bevy bump.
#
# Port faithfully — keep this diffable against upstream (the udlod playbook).
# Examples, benches, and the heavyweight dev-dependencies were dropped on
# vendoring (we don't run them); `Cargo.toml.orig` preserves the upstream
# manifest for reference. The only intended local divergence is precision
# fixes we already need (see `thalos_udlod`'s `PreciseRotation`).
[package]
name = "big_space"
version = "0.12.0"
edition = "2021"
description = "A floating origin plugin for bevy (vendored fork for Thalos)"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "floating-origin", "large-scale", "space"]
repository = "https://github.com/aevyrie/big_space"

[features]
default = ["std"]
debug = ["std", "bevy_gizmos", "bevy_color"]
camera = ["std", "bevy_camera", "bevy_time", "bevy_input"]
i8 = []
i16 = []
i32 = []
i64 = []
i128 = []

std = [
  "bevy_app/std",
  "bevy_ecs/std",
  "bevy_math/std",
  "bevy_reflect/std",
  "bevy_transform/std",
  "bevy_utils/std",
  "bevy_platform/std",
  "bevy_color?/std",
  "bevy_input?/std",
  "bevy_time?/std",
]
libm = ["bevy_math/libm", "dep:libm"]

[dependencies]
smallvec = { version = "1.15.0", default-features = false } # Already used by bevy in commands
bevy_app = { version = "0.19.0", default-features = false, features = [
  "bevy_reflect",
] }
bevy_ecs = { version = "0.19.0", default-features = false }
bevy_log = { version = "0.19.0", default-features = false }
bevy_math = { version = "0.19.0", default-features = false }
bevy_reflect = { version = "0.19.0", default-features = false, features = [
  "glam",
] }
bevy_tasks = { version = "0.19.0", default-features = false }
bevy_transform = { version = "0.19.0", default-features = false, features = [
  "bevy-support",
  "bevy_reflect",
] }
bevy_utils = { version = "0.19.0", default-features = false }
bevy_platform = { version = "0.19.0", default-features = false, features = [
  "alloc",
] }
# Optional
bevy_color = { version = "0.19.0", default-features = false, optional = true }
bevy_gizmos = { version = "0.19.0", default-features = false, optional = true }
bevy_camera = { version = "0.19.0", default-features = false, optional = true }
bevy_input = { version = "0.19.0", default-features = false, optional = true, features = [
  "keyboard",
  "mouse",
] }
bevy_time = { version = "0.19.0", default-features = false, optional = true }
libm = { version = "0.2", default-features = false, optional = true }

# Dev-deps for the vendored upstream test suite (`src/**` `#[cfg(test)]`
# modules). Not in the normal build/clippy surface, but kept so the tests
# validate the port. `bevy_scene` was dropped from the upstream feature list
# (the crate became `bevy_world_serialization` in 0.19 and the tests don't use
# scenes).
[dev-dependencies]
bevy = { version = "0.19", default-features = false, features = [
  "bevy_log",
  "bevy_render",
  "bevy_window",
  "multi_threaded",
  "reflect_auto_register",
] }
noise = "0.9"
turborand = "0.10"

[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"
