[package]
name = "thalos_game"
version.workspace = true
edition.workspace = true

[dependencies]
thalos_physics_canonical = { path = "../physics_canonical" }
thalos_control = { path = "../control" }
thalos_world = { path = "../world" }
thalos_input = { path = "../input" }
thalos_body_render = { path = "../body_render" }
thalos_terrain = { path = "../terrain" }
thalos_physics_local = { path = "../physics_local" }
thalos_celestial = { path = "../celestial" }
thalos_shipyard = { path = "../shipyard" }
thalos_volumetric_clouds = { path = "../volumetric_clouds" }
bevy = { version = "0.18", features = ["wayland", "jpeg", "bevy_remote"] }
bevy_brp_extras = "0.19"
bevy_egui = "0.39"
big_space = { version = "0.12", features = ["i64"] }
tracing = "0.1"
ab_glyph = "0.2"
resvg = { version = "0.47", default-features = false }
rayon = "1.12"
# f32 → f16 packing for the multi-scatter LUT image (Rgba16Float is linear-
# filterable without the FLOAT32_FILTERABLE wgpu feature). Already in the lock
# graph transitively; pinned here for the explicit conversion in `spawn.rs`.
half = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Profiling. Enable one at a time. Chrome produces trace-*.json in cwd;
# Tracy streams to a running Tracy client over localhost.
profile-chrome = ["bevy/trace_chrome"]
profile-tracy = ["bevy/trace_tracy"]
