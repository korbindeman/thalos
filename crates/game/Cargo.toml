[package]
name = "thalos_game"
version.workspace = true
edition.workspace = true

[dependencies]
thalos_physics = { path = "../physics" }
thalos_input = { path = "../input" }
thalos_planet_rendering = { path = "../planet_rendering" }
thalos_terrain = { path = "../terrain" }
thalos_terrain_gen = { path = "../terrain_gen" }
thalos_celestial = { path = "../celestial" }
thalos_shipyard = { path = "../shipyard" }
thalos_ship_rendering = { path = "../ship_rendering" }
bevy = { version = "0.18", features = ["wayland", "jpeg"] }
bevy_terrain = { workspace = true }
bevy_egui = "0.39"
big_space = { version = "0.12", features = ["i64"] }
tracing = "0.1"
ab_glyph = "0.2"
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Profiling. Enable one at a time. Chrome produces trace-*.json in cwd;
# Tracy streams to a running Tracy client over localhost.
profile-chrome = ["bevy/trace_chrome"]
profile-tracy = ["bevy/trace_tracy"]
