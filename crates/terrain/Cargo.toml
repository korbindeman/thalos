[package]
name = "thalos_terrain"
version.workspace = true
edition.workspace = true

[dependencies]
glam = { version = "0.30.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
rayon = "1.12"
noise = "0.9"
# default-features = false drops the optional `bevy` feature; we only use
# the pure-glam `cpu` module. Without this, terrain (and transitively
# thalos_physics_canonical) pulls in the full Bevy tree, violating the
# "physics crate has no Bevy" invariant (CI-guarded — see CLAUDE.md
# Design invariants and .github/workflows/ci.yml).
bevy_erosion_filter = { version = "0.1.2", default-features = false }
