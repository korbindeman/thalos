[package]
name = "thalos_bake_dump"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bake_dump"
path = "src/main.rs"

[dependencies]
thalos_physics_canonical = { path = "../physics_canonical" }
thalos_world = { path = "../world" }
thalos_terrain = { path = "../terrain" }
bevy_erosion_filter = { version = "0.1.2", default-features = false }
glam = "0.30.10"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.12"
indicatif = "0.18"
# GPU compute for the mid-frequency-detail stage. This tool is headless and
# stays on latest stable wgpu even when Bevy's renderer stack lags behind.
wgpu = "29.0.3"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
anyhow = "1.0"
