[package]
name = "thalos_shipyard"
publish = false
version.workspace = true
edition.workspace = true

[dependencies]
bevy = "0.19"
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
# INTERIM (Phase 4a, docs/architecture.md): the craft hull material moved to the
# render crate; this re-exports it through `material.rs` (used by `appearance.rs`
# + the game's ship view / editor). A backwards edge to be removed by the
# rendering-decoupling follow-up.
thalos_body_render = { path = "../body_render" }
