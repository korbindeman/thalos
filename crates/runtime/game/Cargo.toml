[package]
name = "thalos_runtime"
publish = false
version.workspace = true
edition.workspace = true

[dependencies]
thalos_physics_canonical = { path = "../../simulation/physics_canonical" }
thalos_control = { path = "../../simulation/control" }
thalos_navigation = { path = "../../simulation/navigation" }
thalos_world = { path = "../../domain/world" }
thalos_input = { path = "../../interface/input" }
thalos_ui = { path = "../../interface/ui" }
thalos_body_render = { path = "../../rendering/render" }
thalos_terrain = { path = "../../domain/terrain" }
thalos_physics_local = { path = "../../simulation/physics_local" }
thalos_celestial = { path = "../../domain/celestial" }
thalos_shipyard = { path = "../../domain/construction" }
thalos_capture_protocol = { path = "../../capture/protocol" }
thalos_diagnostics = { workspace = true }
bevy = { version = "0.19", features = ["wayland", "jpeg"] }
bevy_egui = "0.41.1"
big_space = { workspace = true }
# Persisted user settings (user/settings.ron — window mode, vsync, UI scale).
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
ab_glyph = "0.2"
resvg = { version = "0.47", default-features = false }
rayon = "1.12"
# F2 desktop screenshot completion writes a PNG from Bevy's captured image.
image = { version = "0.25", default-features = false, features = ["png"] }
# f32 → f16 packing for the multi-scatter LUT image (Rgba16Float is linear-
# filterable without the FLOAT32_FILTERABLE wgpu feature). Already in the lock
# graph transitively; pinned here for the explicit conversion in `spawn.rs`.
half = "2"
# Optional deep GPU-memory instrumentation. Keeping `counters` out of the
# default graph lets game/screenshot/preview reuse one Bevy/wgpu dylib. Enable
# `gpu-counters` only for a THALOS_MEM_DIAG investigation.
wgpu = { version = "29", default-features = false, features = ["counters"], optional = true }
# The top-level `bevy` crate does not re-export bevy_render's `gles` feature,
# and Bevy 0.19 ships native Linux builds Vulkan-only by default. The WSL2
# headless capture path needs wgpu's GL backend compiled in, so both dev lanes
# pull it through this optional direct dependency. Player/release builds are
# unchanged. The dependency KEY must not be `bevy_render`: Bevy's derive-macro
# manifest lookup (`ShaderType` etc.) would then emit `bevy_render::…` paths
# that only resolve when the optional feature is on.
bevy_render_gl_backend = { package = "bevy_render", version = "0.19", default-features = false, features = ["gles"], optional = true }

[features]
# The one renderer-development fingerprint, shared by the interactive
# launcher, cold capture, AND the persistent capture server
# (ADR-20260724T153619Z-retire-hotpatch-single-stable-capture-lane).
# `embedded_watcher` includes Bevy's normal file watcher, so both
# `assets/shaders/*` and crate-embedded WGSL hot-reload in any running
# dev process — the persistent screenshot host and the interactive game
# alike. Rust hot-patching was retired (an applied subsecond patch
# stack-overflowed the app, INC-20260724T044418Z); Rust edits restart the
# capture host instead, automatically.
dev-renderer = [
    "bevy/dynamic_linking",
    "bevy/embedded_watcher",
    "dep:bevy_render_gl_backend",
]
# Profiling. Enable one at a time. Chrome produces trace-*.json in cwd;
# Tracy streams to a running Tracy client over localhost.
profile-chrome = ["bevy/trace_chrome"]
profile-tracy = ["bevy/trace_tracy"]
gpu-counters = ["dep:wgpu"]
