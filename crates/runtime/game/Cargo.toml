[package]
name = "thalos_runtime"
publish = false
version.workspace = true
edition.workspace = true

[dependencies]
thalos_physics_canonical = { path = "../../simulation/physics_canonical" }
thalos_control = { path = "../../simulation/control" }
thalos_world = { path = "../../domain/world" }
thalos_input = { path = "../../interface/input" }
thalos_ui = { path = "../../interface/ui" }
thalos_body_render = { path = "../../rendering/render" }
thalos_terrain = { path = "../../domain/terrain" }
thalos_physics_local = { path = "../../simulation/physics_local" }
thalos_celestial = { path = "../../domain/celestial" }
thalos_shipyard = { path = "../../domain/construction" }
thalos_capture_protocol = { path = "../../capture/protocol" }
bevy = { version = "0.19", features = ["wayland", "jpeg"] }
big_space = { workspace = true }
# Persisted user settings (user/settings.ron — window mode, vsync, UI scale).
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
ab_glyph = "0.2"
resvg = { version = "0.47", default-features = false }
rayon = "1.12"
# F2 desktop screenshot completion writes a PNG from Bevy's captured image.
image = { version = "0.25", default-features = false, features = ["png"] }
# f32 → f16 packing for the multi-scatter LUT image (Rgba16Float is linear-
# filterable without the FLOAT32_FILTERABLE wgpu feature). Already in the lock
# graph transitively; pinned here for the explicit conversion in `spawn.rs`.
half = "2"
# Optional deep GPU-memory instrumentation. Keeping `counters` out of the
# default graph lets game/screenshot/preview reuse one Bevy/wgpu dylib. Enable
# `gpu-counters` only for a THALOS_MEM_DIAG investigation.
wgpu = { version = "29", default-features = false, features = ["counters"], optional = true }

[features]
# Normal renderer-development fingerprint shared by the interactive launcher,
# cold capture, and visual labs. The persistent hotpatch lane below is the one
# intentional static-renderer exception.
dev-renderer = ["bevy/dynamic_linking"]
# Agent-facing persistent renderer loop. `embedded_watcher` includes Bevy's
# normal file watcher, so both `assets/shaders/*` and crate-embedded WGSL are
# reloaded in the running capture process. Hotpatching stays dev-only and is
# driven by the Dioxus `dx serve --hot-patch` launcher.
dev-iteration = ["bevy/hotpatching", "bevy/embedded_watcher"]
# Profiling. Enable one at a time. Chrome produces trace-*.json in cwd;
# Tracy streams to a running Tracy client over localhost.
profile-chrome = ["bevy/trace_chrome"]
profile-tracy = ["bevy/trace_tracy"]
gpu-counters = ["dep:wgpu"]
