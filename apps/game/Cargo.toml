[package]
name = "thalos_game"
publish = false
version.workspace = true
edition.workspace = true

[dependencies]
thalos_runtime = {
    path = "../../crates/runtime/app",
    default-features = false,
    features = ["game"],
}

[features]
default = []
# Capability and default are separate so release/profile builds can choose
# exactly what they contain. `neural-terrain-default` implies the capability;
# a future global default is one edit to `default` above, while
# `--no-default-features` remains a reproducible procedural-only build.
neural-terrain = ["thalos_runtime/neural-terrain"]
neural-terrain-default = ["neural-terrain", "thalos_runtime/neural-terrain-default"]
dev-renderer = ["neural-terrain", "thalos_runtime/dev-renderer"]
profile-chrome = ["thalos_runtime/profile-chrome"]
profile-tracy = ["thalos_runtime/profile-tracy"]
gpu-counters = ["thalos_runtime/gpu-counters"]
legacy-udlod = ["thalos_runtime/legacy-udlod"]
